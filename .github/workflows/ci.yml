# CPU test suite (roadmap card R-01).
# GPU extras (numba, cupy, wgpu) are deliberately not installed: their tests
# must skip cleanly, and a green run here says nothing about GPU correctness.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU dependencies
        run: python -m pip install numpy pytest

      - name: Compile all modules, including GPU backends
        run: python -m py_compile ece/*.py tools/*.py

      - name: Run test suite
        run: python -m pytest tests -q -rs

      - name: Load every shipped config
        run: |
          python -c "from pathlib import Path; from ece.config import load_config; \
            [print(p.name, load_config(p).species_count) for p in sorted(Path('configs').glob('*.toml'))]"
